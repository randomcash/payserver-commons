[package]
name = "api-types"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "The PayServer HTTP contract: request and response shapes, shared by every server and the client"

[dependencies]
types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
utoipa = { version = "5.3", features = ["uuid", "chrono"], optional = true }

[features]
default = []
openapi = ["utoipa", "types/openapi"]

[dev-dependencies]
