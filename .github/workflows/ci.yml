name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Format check
        run: cargo fmt --all -- --check

      # ui-kit's `auth` feature is optional, so the default build never compiles
      # ui-kit/src/auth - login, registration and recovery. A PR adding code
      # there could be clippy-clean and not build: three E0425s reached a green
      # PR on 2026-09-06 (RCS-205 review).
      #
      # Plain `check`, deliberately not `clippy -D warnings`: that module has 84
      # pre-existing lint findings, tracked in RCS-199. This catches the compile
      # break now without dragging those into unrelated PRs. Promote to clippy
      # once RCS-199 clears them.
      - name: Compile check (all features)
        run: cargo check --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --lib --no-fail-fast

  audit:
    name: Audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
        continue-on-error: true
