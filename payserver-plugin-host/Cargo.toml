[package]
name = "payserver-plugin-host"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "The wasmtime plugin host: load-time gate, instantiation, bounded calls, artifacts and page rendering, shared by every payserver"

[dependencies]
payserver-plugin-api = { path = "../payserver-plugin-api" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
wasmtime = { version = "47.0.4", default-features = false, features = ["runtime", "cranelift"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wat = "1"
tempfile = "3"
